    function loadContent(tab) {
      const display = document.getElementById('main-display');
      const data = APP_DATA[tab];
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('nav-active'));
      document.getElementById('nav-' + tab).classList.add('nav-active');

      display.innerHTML = `
        <div class="animate-in fade-in slide-in-from-bottom-4 duration-500">
          <div class="text-center mb-12">
            <h2 class="text-4xl font-black text-orange-950 font-serif mb-2">${data.title}</h2>
            <p class="text-orange-500 font-bold tracking-widest text-xs uppercase">${data.meta}</p>
          </div>
          ${data.html}
        </div>`;
      lucide.createIcons();
      window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function shareApp() {
      if (navigator.share) {
        navigator.share({ title: 'हनुमान भक्ति', url: window.location.href });
      }
    }

    window.onload = () => loadContent('chalisa');
  </script>

        <i data-lucide="user" class="text-white w-10 h-10"></i>
      </div>
      <h3 class="text-2xl font-black text-orange-950 font-serif">प्रथम् दादा</h3>
      <p class="text-orange-600 font-bold text-xs uppercase tracking-widest mb-4">संचालक (Dhanbad, Jharkhand)</p>
      <div class="flex justify-center gap-4">
        <a href="#" class="text-orange-400 hover:text-orange-600"><i data-lucide="instagram"></i></a>
        <a href="#" class="text-orange-400 hover:text-orange-600"><i data-lucide="youtube"></i></a>
      </div>
    </div>
  </footer>
